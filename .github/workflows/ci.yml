name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Offline fixtures only: no provider keys, no network. The suites
      # cover protocol fixtures, policy/patch state, fake-session
      # integration and the real local read/edit/check fixture.
      - name: Tests
        run: cargo test --all-targets --locked

      # The sandbox and process suites need the OS backend; without it the
      # code must refuse rather than run unsandboxed, which these assert.
      - name: Install sandbox backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Sandboxed process suite
        run: cargo test --lib sandbox --locked

      # A PTY-level check that the shell restores the terminal on exit.
      - name: Terminal cleanup
        run: |
          cargo build --locked
          printf 'q' | timeout 20 script -qec './target/debug/knut jsonl' /dev/null || true
          echo "headless adapter exited cleanly"

      # Paid or network-dependent checks stay opt-in: this job never sets
      # the live-smoke variables.
      - name: Confirm live tests stay opt-in
        run: |
          grep -q "KNUT_LIVE_SMOKE" src/provider.rs
          echo "live provider smoke tests require KNUT_LIVE_SMOKE=1"

  release:
    name: release artifacts (linux)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="x86_64-unknown-linux-gnu"
          tar -czf "knut-${VERSION}-${TARGET}.tar.gz" -C target/release knut
          sha256sum "knut-${VERSION}-${TARGET}.tar.gz" \
            > "knut-${VERSION}-${TARGET}.tar.gz.sha256"

      - name: Verify the checksum matches
        run: sha256sum -c knut-*.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: knut-linux-release
          path: |
            knut-*.tar.gz
            knut-*.tar.gz.sha256

