name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The sandbox and process suites need the OS backend; without it the
      # code must refuse rather than run unsandboxed, which these assert.
      - name: Install sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          # Ubuntu restricts user namespaces unless the executable has a profile.
          sudo tee /etc/apparmor.d/bwrap-userns-restrict >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-all --ro-bind / / -- /bin/true

      # Offline fixtures only: no provider keys, no network. The suites
      # cover protocol fixtures, policy/patch state, fake-session
      # integration and the real local read/edit/check fixture.
      - name: Tests
        run: cargo test --workspace --all-targets --locked -- --test-threads=2

      - name: Headless process regression
        run: |
          cargo build -p knut --locked
          node scripts/smoke-harness.mjs

  release:
    name: release artifacts (linux)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="x86_64-unknown-linux-gnu"
          tar -czf "knut-${VERSION}-${TARGET}.tar.gz" -C target/release knut
          sha256sum "knut-${VERSION}-${TARGET}.tar.gz" \
            > "knut-${VERSION}-${TARGET}.tar.gz.sha256"

      - name: Verify the checksum matches
        run: sha256sum -c knut-*.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: knut-linux-release
          path: |
            knut-*.tar.gz
            knut-*.tar.gz.sha256
