[package]
name = "knut"
version = "0.1.0"
edition = "2024"
description = "Experimental agentic harness with System One routing"
license = "MIT"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tracing = "0.1"
