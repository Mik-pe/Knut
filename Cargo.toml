[package]
name = "knut"
version = "0.1.0"
edition = "2024"
description = "Experimental agentic harness with System One routing"
license = "MIT"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
