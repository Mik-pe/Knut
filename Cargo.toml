[package]
name = "knut"
version.workspace = true
edition.workspace = true
description = "Agent harness for your terminal"
license.workspace = true

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.29.0"
futures-util = { version = "0.3", default-features = false }
globset = "0.4.20"
ignore = "0.4.33"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
libc = "0.2.189"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "process", "sync", "time"] }
tracing = "0.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"

[dependencies]
async-trait.workspace = true
knut-runtime = { path = "crates/knut-runtime" }
knut-terminal = { path = "crates/knut-terminal" }
serde_json.workspace = true
tokio.workspace = true
